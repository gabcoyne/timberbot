[workspace]
resolver = "2"
members = [
    "crates/timberbot-protocol",
    "crates/timberbot-client",
    "crates/timberbot-save",
    "crates/timberbot-mock",
    "crates/timberbot-mcp",
    "crates/timberbot-agent",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-or-later"
repository = "https://github.com/gabcoyne/timberbot"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

timberbot-protocol = { path = "crates/timberbot-protocol" }
timberbot-client = { path = "crates/timberbot-client" }
timberbot-save = { path = "crates/timberbot-save" }
timberbot-mock = { path = "crates/timberbot-mock" }
timberbot-agent = { path = "crates/timberbot-agent" }
